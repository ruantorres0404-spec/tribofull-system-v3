                                    <div key={result.teamId} className={`flex items-center gap-3 p-2 rounded-lg border-l-2 ${team.lightBg} border-l-cyan-400 border border-cyan-900/40`}>
                                      <div className="font-montserrat font-bold text-lg text-cyan-600">#{result.place}</div>
                                      <div>
                                        <div className={`font-inter font-bold text-[10px] uppercase tracking-wider ${team.text}`}>{team.name}</div>
                                        <div className="text-cyan-200 font-mono text-xs">{result.points} XP</div>
                                      </div>
                                    </div>
                                  );
                                })}
                              </div>
                            )}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {activeAdminSubTab === 'penalidades' && (
                <div className="space-y-8 animate-fade-in">
                  <div className="solo-panel p-6 sm:p-8 rounded-xl relative border-l-2 border-l-red-500" style={{ boxShadow: '0 0 20px rgba(239, 68, 68, 0.15)' }}>
                    <h3 className="text-sm font-montserrat font-bold text-red-300 mb-5 flex items-center gap-2 uppercase tracking-widest"><AlertTriangle className="w-4 h-4 text-red-400" /> Aplicar Penalidade (-XP)</h3>
                    <form onSubmit={handleCreatePenalty} className="space-y-4">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label htmlFor="pen-team" className="block text-xs font-montserrat font-bold text-cyan-400 uppercase tracking-widest mb-2">Tribo Alvo</label>
                          <select id="pen-team" value={penaltyTeamId} onChange={(e) => setPenaltyTeamId(e.target.value)} className="w-full px-4 py-3 rounded-lg bg-slate-950 border border-red-500/40 text-cyan-200 outline-none font-inter text-sm" required>
                            <option value="">Selecionar Tribo...</option>
                            {teams.map(team => <option key={team.id} value={team.id}>{team.name}</option>)}
                          </select>
                        </div>
                        <div>
                          <label htmlFor="pen-pts" className="block text-xs font-montserrat font-bold text-cyan-400 uppercase tracking-widest mb-2">Pontos a Retirar (XP)</label>
                          <input id="pen-pts" type="number" min="1" value={penaltyPoints} onChange={(e) => setPenaltyPoints(e.target.value)} placeholder="Ex: 50" className="w-full px-4 py-3 rounded-lg bg-slate-950 border border-red-500/40 text-red-300 outline-none font-mono text-sm" required />
                        </div>
                      </div>
                      <div>
                        <label htmlFor="pen-reason" className="block text-xs font-montserrat font-bold text-cyan-400 uppercase tracking-widest mb-2">Motivo da Penalidade</label>
                        <input id="pen-reason" type="text" value={penaltyReason} onChange={(e) => setPenaltyReason(e.target.value)} placeholder="Ex: Desrespeito às regras da masmorra" className="w-full px-4 py-3 rounded-lg bg-slate-950 border border-red-500/40 text-cyan-200 outline-none font-inter text-sm" required />
                      </div>
                      <div className="flex justify-end">
                        <button type="submit" className="bg-red-600/80 hover:bg-red-500 border border-red-400 text-slate-950 font-montserrat font-bold text-xs py-3 px-6 rounded-lg transition-colors uppercase tracking-widest shadow-[0_0_12px_rgba(239,68,68,0.4)]">Aplicar Punição</button>
                      </div>
                    </form>
                  </div>

                  <div>
                    <h3 className="text-sm font-montserrat font-bold text-red-300 mb-5 uppercase tracking-widest">[HISTÓRICO DE PUNIÇÕES]</h3>
                    {penalties.length === 0 ? (
                      <p className="text-cyan-600 font-mono text-xs solo-panel p-6 rounded-xl text-center uppercase tracking-widest">Nenhuma penalidade aplicada até o momento.</p>
                    ) : (
                      <div className="space-y-3">
                        {penalties.map(p => {
                          const team = teams.find(t => t.id === p.teamId);
                          return (
                            <div key={p.id} className="solo-panel p-4 rounded-xl flex items-center justify-between border border-red-500/30">
                              <div>
                                <div className="flex items-center gap-3 mb-1">
                                  <span className={`font-montserrat font-bold text-sm uppercase tracking-wider ${team ? team.text : 'text-red-400'}`}>{team ? team.name : 'Tribo Desconhecida'}</span>
                                  <span className="bg-red-950/80 text-red-400 font-mono font-bold text-xs px-2 py-0.5 rounded border border-red-500/40">-{p.points} XP</span>
                                </div>
                                <p className="text-cyan-200 font-inter text-xs">Motivo: {p.reason}</p>
                              </div>
                              <button aria-label="Anular penalidade" onClick={() => askConfirm('[ALERTA DO SISTEMA] Deseja anular esta penalidade aplicada?', () => onDeletePenalty(p.id))} className="text-red-400 hover:text-red-200 p-2 hover:bg-red-950/50 rounded-lg transition-colors border border-red-900/40"><Trash2 className="w-4 h-4" /></button>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </div>
              )}

              {activeAdminSubTab === 'dados' && (
                <div className="space-y-8 animate-fade-in">
                  <div className="solo-panel p-6 sm:p-8 rounded-xl border-l-2 border-l-cyan-400">
                    <h3 className="text-sm font-montserrat font-bold text-cyan-300 mb-2 flex items-center gap-2 uppercase tracking-widest"><Download className="w-4 h-4 text-cyan-400" /> Backup</h3>
                    <p className="text-xs text-cyan-600 font-mono mb-5">Os dados ficam só neste navegador. Exporte um backup antes e durante o evento.</p>
                    <div className="flex flex-wrap gap-4">
                      <button onClick={onExport} className="flex items-center gap-2 px-5 py-3 rounded-lg font-montserrat font-bold text-xs uppercase tracking-widest border border-cyan-400 bg-cyan-950/80 text-cyan-300 hover:bg-cyan-900/80 transition-all"><Download className="w-4 h-4" /> Exportar JSON</button>
                      <label className="flex items-center gap-2 px-5 py-3 rounded-lg font-montserrat font-bold text-xs uppercase tracking-widest border border-cyan-500/40 bg-slate-900 text-cyan-400 hover:bg-slate-800 transition-all cursor-pointer">
                        <Upload className="w-4 h-4" /> Importar JSON
                        <input type="file" accept="application/json,.json" onChange={handleImportFile} className="sr-only" />
                      </label>
                    </div>
                  </div>

                  <div className="solo-panel p-6 sm:p-8 rounded-xl border-l-2 border-l-red-500" style={{ boxShadow: '0 0 20px rgba(239, 68, 68, 0.15)' }}>
                    <h3 className="text-sm font-montserrat font-bold text-red-300 mb-2 flex items-center gap-2 uppercase tracking-widest"><AlertTriangle className="w-4 h-4 text-red-400" /> Zona de Perigo</h3>
                    <p className="text-xs text-cyan-600 font-mono mb-5">Ações irreversíveis. Exporte um backup antes.</p>
                    <div className="flex flex-wrap gap-4">
                      <button onClick={() => askConfirm('[ALERTA DO SISTEMA] Apagar provas, penalidades, pontos avulsos, cronômetros e mensagem? Os dados das tribos são mantidos.', () => onResetEvent(false))} className="flex items-center gap-2 px-5 py-3 rounded-lg font-montserrat font-bold text-xs uppercase tracking-widest border border-red-500/60 bg-red-950/60 text-red-300 hover:bg-red-900/60 transition-all"><RotateCcw className="w-4 h-4" /> Resetar Evento</button>
                      <button onClick={() => askConfirm('[ALERTA DO SISTEMA] Apagar TUDO, incluindo nomes, líderes e caçadores das tribos?', () => onResetEvent(true))} className="flex items-center gap-2 px-5 py-3 rounded-lg font-montserrat font-bold text-xs uppercase tracking-widest border border-red-500/60 bg-red-950/60 text-red-300 hover:bg-red-900/60 transition-all"><Trash2 className="w-4 h-4" /> Resetar Tudo</button>
                    </div>
                  </div>
                </div>
              )}

              <ConfirmModal confirm={confirmModal} onClose={closeConfirm} />
            </div>
          );
        };

        // ==========================================
        // APP
        // ==========================================
        const NAV = [
          { id: 'ranking', label: 'Ranking' },
          { id: 'quadro', label: 'Quadro' },
          { id: 'tribos', label: 'Tribos' },
          { id: 'timers', label: 'Relógios' },
          { id: 'admin', label: 'Admin', adminOnly: true },
        ];

        function App() {
          const [activeTab, setActiveTab] = useState('ranking');
          const [currentUser, setCurrentUser] = useState(loadSession);
          const [systemPassword, setSystemPassword] = useState('');

          // Dados compartilhados (Firebase) ou locais, conforme a configuração
          const [tasks, setTasks, rTasks] = useShared('tasks', normalizeTasks);
          const [penalties, setPenalties, rPenalties] = useShared('penalties', normalizePenalties);
          const [teams, setTeams, rTeams] = useShared('teams', normalizeTeams, serializeTeams);
          const [settings, setSettings, rSettings] = useShared('settings', normalizeSettings);
          const [timers, setTimers, rTimers] = useShared('timers', normalizeTimers);
          const [bonus, setBonus, rBonus] = useShared('bonus', normalizeBonus);
          const allReady = rTasks && rPenalties && rTeams && rSettings && rTimers && rBonus;
          const [online, setOnline] = useState(true);
          const [toast, setToast] = useState({ show: false, message: '', type: 'error' });
          const toastTimer = useRef(null);

          const showToast = useCallback((message, type = 'error') => {
            clearTimeout(toastTimer.current);
            setToast({ show: true, message, type });
            toastTimer.current = setTimeout(() => setToast({ show: false, message: '', type: 'error' }), 3500);
          }, []);

          useEffect(() => () => clearTimeout(toastTimer.current), []);

          // Conexão com o Firebase, hora do servidor e avisos de erro de gravação
          useEffect(() => {
            if (!SHARED) return;
            const connRef = db.ref('.info/connected');
            const offRef = db.ref('.info/serverTimeOffset');
            const onConn = connRef.on('value', (s) => setOnline(!!s.val()));
            const onOff = offRef.on('value', (s) => { serverOffset = Number(s.val()) || 0; });
            const onErr = (e) => showToast(e.detail === 'read' ? 'Sem permissão para ler o banco. Confira as regras do Firebase.' : 'Falha ao salvar na nuvem. Confira a conexão e as regras do Firebase.');
            window.addEventListener('tribofull-error', onErr);
            return () => { connRef.off('value', onConn); offRef.off('value', onOff); window.removeEventListener('tribofull-error', onErr); };
          }, [showToast]);
          useEffect(() => { if (currentUser) store.save(KEYS.session, currentUser); else { try { localStorage.removeItem(KEYS.session); } catch (e) {} } }, [currentUser]);

          // Pontuação: média usa só pontos de provas; penalidades entram só no total
          const teamScores = useMemo(() => {
            const completed = tasks.filter(t => t.status === 'completed');
            return teams.map((team, idx) => {
              let taskPoints = 0, tasksCompleted = 0, firstPlaces = 0;
              completed.forEach(task => {
                const res = task.results?.find(r => r.teamId === team.id);
                if (res) { taskPoints += res.points; tasksCompleted += 1; if (res.place === 1) firstPlaces += 1; }
              });
              const penaltyTotal = penalties.filter(p => p.teamId === team.id).reduce((s, p) => s + p.points, 0);
              const points = taskPoints - penaltyTotal;
              return { ...team, idx, points, taskPoints, penaltyTotal, firstPlaces, tasksCompleted, average: tasksCompleted > 0 ? (taskPoints / tasksCompleted).toFixed(1) : '0.0' };
            }).sort((a, b) => b.points - a.points || b.firstPlaces - a.firstPlaces || a.idx - b.idx);
          }, [tasks, penalties, teams]);

          const completedTasks = useMemo(() => tasks.filter(t => t.status === 'completed').reverse(), [tasks]);
          const pendingTasks = useMemo(() => tasks.filter(t => t.status === 'pending'), [tasks]);

          // Regra única de visibilidade: revelado => todos veem; oculto => cada um vê só a própria tribo (admin vê tudo)
          const isAdmin = currentUser?.role === 'admin';
          const rankingHidden = !settings.isRankingVisible && !isAdmin;
          const canSeeTeam = useCallback((teamId) => !rankingHidden || (!!currentUser && currentUser.tribeId === teamId), [rankingHidden, currentUser]);

          const handleLogin = (e) => {
            e.preventDefault();
            const entry = ACCESS[systemPassword.trim().toLowerCase()];
            if (entry) {
              setCurrentUser({ role: entry.role, tribeId: entry.tribeId });
              setActiveTab('ranking');
              showToast(entry.role === 'admin' ? 'SISTEMA DESBLOQUEADO: ' + entry.label : 'ACESSO CONCEDIDO: ' + entry.label, 'success');
            } else {
              showToast('SENHA DE ACESSO INVÁLIDA');
            }
            setSystemPassword('');
          };

          const handleLogout = () => { setCurrentUser(null); setActiveTab('ranking'); showToast('SESSÃO ENCERRADA', 'success'); };

          const handleCreateTask = useCallback((name) => {
            setTasks(prev => [...prev, { id: Date.now().toString(), name, status: 'pending', results: [] }]);
            showToast('MASMORRA CADASTRADA COM SUCESSO', 'success');
          }, [showToast]);
          const handleDeleteTask = useCallback((id) => { setTasks(prev => prev.filter(t => t.id !== id)); showToast('MASMORRA EXPURGADA', 'success'); }, [showToast]);
          const handleRenameTask = useCallback((id, name) => { setTasks(prev => prev.map(t => t.id === id ? { ...t, name } : t)); showToast('PROVA RENOMEADA', 'success'); }, [showToast]);
          const handleCompleteTask = useCallback((id, results) => { setTasks(prev => prev.map(t => t.id === id ? { ...t, status: 'completed', results } : t)); showToast('COLOCAÇÃO REGISTRADA COM SUCESSO', 'success'); }, [showToast]);

          const handleUpdateTeam = useCallback((updated) => {
            setTeams(prev => prev.map(t => t.id === updated.id ? { ...t, ...EDITABLE_TEAM_FIELDS(updated) } : t));
            showToast('DOSSIÊ DA GUILDA ATUALIZADO', 'success');
          }, [showToast]);

          const handleToggleVisibility = useCallback(() => {
            const next = !settings.isRankingVisible;
            setSettings(s => ({ ...s, isRankingVisible: next }));
            showToast(next ? 'RANKING PÚBLICO REVELADO' : 'RANKING OCULTADO', 'success');
          }, [settings.isRankingVisible, showToast]);

          const handleUpdateMessage = useCallback((msg) => { setSettings(s => ({ ...s, systemMessage: msg })); showToast('MURAL DO SISTEMA ATUALIZADO', 'success'); }, [showToast]);
          const handleAddPenalty = useCallback((data) => { setPenalties(prev => [{ id: Date.now().toString(), ...data }, ...prev]); showToast('PENALIDADE APLICADA', 'success'); }, [showToast]);
          const handleDeletePenalty = useCallback((id) => { setPenalties(prev => prev.filter(p => p.id !== id)); showToast('PENALIDADE ANULADA', 'success'); }, [showToast]);
          const handleAddBonus = useCallback((data) => { setBonus(prev => [{ id: Date.now().toString(), createdAt: Date.now(), ...data }, ...prev]); showToast('PONTOS AVULSOS REGISTRADOS', 'success'); }, [showToast]);
          const handleDeleteBonus = useCallback((id) => { setBonus(prev => prev.filter(b => b.id !== id)); showToast('REGISTRO APAGADO', 'success'); }, [showToast]);

          // Backup
          const handleExport = useCallback(() => {
            try {
              const data = { app: 'tribofull', version: 3, exportedAt: new Date().toISOString(), tasks, penalties, bonus, teams: teams.map(EDITABLE_TEAM_FIELDS), settings, timers };
              const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
              const url = URL.createObjectURL(blob);
              const a = document.createElement('a');
              a.href = url;
              a.download = `tribofull-backup-${new Date().toISOString().slice(0, 16).replace(/[:T]/g, '-')}.json`;
              document.body.appendChild(a); a.click(); a.remove();
              setTimeout(() => URL.revokeObjectURL(url), 1000);
              showToast('BACKUP EXPORTADO', 'success');
            } catch (e) { showToast('Falha ao exportar o backup.'); }
          }, [tasks, penalties, bonus, teams, settings, timers, showToast]);

          const handleImportData = useCallback((data) => {
            setTasks(Array.isArray(data.tasks) ? data.tasks : []);
            setPenalties(Array.isArray(data.penalties) ? data.penalties : []);
            setBonus(Array.isArray(data.bonus) ? data.bonus : []);
            setTeams(mergeTeams(data.teams));
            setSettings(data.settings && typeof data.settings === 'object' ? { ...DEFAULT_SETTINGS, ...data.settings } : DEFAULT_SETTINGS);
            setTimers(data.timers && typeof data.timers === 'object' ? { ...makeTimers(), ...data.timers } : makeTimers());
            showToast('BACKUP IMPORTADO COM SUCESSO', 'success');
          }, [showToast]);

          const handleResetEvent = useCallback((includeTeams) => {
            setTasks([]); setPenalties([]); setBonus([]); setTimers(makeTimers()); setSettings(DEFAULT_SETTINGS);
            if (includeTeams) setTeams(DEFAULT_TEAM_CONFIG);
            showToast(includeTeams ? 'SISTEMA RESETADO POR COMPLETO' : 'EVENTO RESETADO', 'success');
          }, [showToast]);

          // Cronômetros
          const startTimer = (id) => {
            const now = serverNow();
            setTimers(prev => { const t = prev[id] || IDLE_TIMER; return t.isRunning ? prev : { ...prev, [id]: { ...t, isRunning: true, lastStart: now } }; });
          };
          const pauseTimer = (id) => {
            const now = serverNow();
            setTimers(prev => { const t = prev[id] || IDLE_TIMER; return t.isRunning ? { ...prev, [id]: { ...t, isRunning: false, time: t.time + (now - t.lastStart) } } : prev; });
          };
          const resetTimer = (id) => setTimers(prev => ({ ...prev, [id]: { ...IDLE_TIMER } }));
          const startAllTimers = () => {
            const now = serverNow();
            setTimers(prev => { const next = { ...prev }; TEAM_IDS.forEach(id => { const t = prev[id] || IDLE_TIMER; next[id] = t.isRunning ? t : { ...t, isRunning: true, lastStart: now }; }); return next; });
          };
          const stopAllTimers = () => {
            const now = serverNow();
            setTimers(prev => { const next = { ...prev }; TEAM_IDS.forEach(id => { const t = prev[id] || IDLE_TIMER; next[id] = t.isRunning ? { ...t, isRunning: false, time: t.time + (now - t.lastStart) } : t; }); return next; });
          };
          const resetAllTimers = () => setTimers(makeTimers());

          const visibleNav = NAV.filter(n => !n.adminOnly || isAdmin);
          const safeTab = visibleNav.some(n => n.id === activeTab) ? activeTab : 'ranking';

          return (
            <div className="min-h-screen bg-slate-950 text-cyan-100 font-inter relative overflow-hidden select-none">
              <div className="absolute inset-0 bg-[radial-gradient(circle_at_50%_0%,rgba(6,182,212,0.15),transparent_70%)] pointer-events-none"></div>
              <div className="absolute inset-0 lightning-overlay pointer-events-none"></div>

              {!currentUser ? (
                <div className="min-h-screen flex items-center justify-center p-4 relative z-10">
                  <div className="solo-panel p-8 sm:p-12 rounded-2xl max-w-md w-full relative animate-fade-in-up">
                    <div className="absolute top-0 left-0 w-3 h-3 border-t-2 border-l-2 border-cyan-400"></div>
                    <div className="absolute top-0 right-0 w-3 h-3 border-t-2 border-r-2 border-cyan-400"></div>
                    <div className="absolute bottom-0 left-0 w-3 h-3 border-b-2 border-l-2 border-cyan-400"></div>
                    <div className="absolute bottom-0 right-0 w-3 h-3 border-b-2 border-r-2 border-cyan-400"></div>

                    <div className="text-center mb-8">
                      <Zap className="w-12 h-12 text-cyan-400 mx-auto mb-3 drop-shadow-[0_0_12px_rgba(6,182,212,0.8)] animate-pulse" />
                      <h1 className="text-xl sm:text-2xl font-montserrat font-bold text-cyan-300 tracking-[0.25em] uppercase drop-shadow-[0_0_8px_rgba(6,182,212,0.5)]">TRIBOFULL</h1>
                      <p className="text-cyan-600/80 font-mono text-xs uppercase tracking-widest mt-2">❯❯ PROTOCOLO DE ACESSO ❮❮</p>
                      {!SHARED && <p className="text-amber-400/90 font-mono text-[10px] uppercase tracking-widest mt-3 leading-relaxed">Modo local: os dados não são compartilhados entre aparelhos</p>}
                    </div>

                    <form onSubmit={handleLogin} className="space-y-6">
                      <div>
                        <label htmlFor="master-key" className="sr-only">Chave Mestra</label>
                        <input id="master-key" type="password" autoComplete="off" value={systemPassword} onChange={(e) => setSystemPassword(e.target.value)} placeholder="Chave Mestra..." className="w-full px-4 py-3 rounded-lg bg-slate-950 border border-cyan-500/40 text-cyan-200 outline-none font-mono text-sm text-center tracking-widest uppercase shadow-[inset_0_0_8px_rgba(6,182,212,0.2)] focus:ring-1 focus:ring-cyan-400" required />
                      </div>
                      <button type="submit" className="w-full bg-cyan-600/80 hover:bg-cyan-500 border border-cyan-400 text-slate-950 font-montserrat font-bold text-xs py-3.5 rounded-lg transition-colors uppercase tracking-[0.2em] shadow-[0_0_15px_rgba(6,182,212,0.4)]">Despertar</button>
                    </form>
                  </div>
                </div>
              ) : !allReady ? (
                <ConnectingScreen />
              ) : (
                <div className="min-h-screen flex flex-col relative z-10">
                  <header className="solo-panel border-b border-cyan-500/30 sticky top-0 z-40 bg-slate-950/95">
                    <div className="max-w-7xl mx-auto px-4 h-20 flex items-center justify-between">
                      <div className="flex items-center gap-3">
                        <Zap className="w-6 h-6 text-cyan-400 drop-shadow-[0_0_8px_rgba(6,182,212,0.8)]" />
                        <span className="font-montserrat font-bold text-lg tracking-[0.2em] text-cyan-200 uppercase drop-shadow-[0_0_6px_rgba(6,182,212,0.4)]">TRIBOFULL</span>
                        <ModeBadge online={online} />
                      </div>

                      <nav aria-label="Principal" className="hidden md:flex items-center gap-2">
                        {visibleNav.map(n => (
                          <button key={n.id} onClick={() => setActiveTab(n.id)} aria-current={safeTab === n.id ? 'page' : undefined} className={`px-4 py-2 rounded-lg font-montserrat font-bold text-xs uppercase tracking-widest transition-all ${safeTab === n.id ? 'bg-cyan-950/80 text-cyan-300 border border-cyan-400' : 'text-cyan-600 hover:text-cyan-300'}`}>{n.label}</button>
                        ))}
                      </nav>

                      <button onClick={handleLogout} className="flex items-center gap-2 text-red-400 hover:text-red-200 px-3 py-2 rounded font-montserrat font-bold text-xs uppercase tracking-widest border border-red-500/30"><LogOut className="w-4 h-4" /> Sair</button>
                    </div>

                    <nav aria-label="Principal (celular)" className="md:hidden flex overflow-x-auto gap-2 px-4 py-2 border-t border-cyan-500/20">
                      {visibleNav.map(n => (
                        <button key={n.id} onClick={() => setActiveTab(n.id)} aria-current={safeTab === n.id ? 'page' : undefined} className={`px-3 py-1.5 rounded font-montserrat font-bold text-[10px] uppercase whitespace-nowrap ${safeTab === n.id ? 'bg-cyan-950 text-cyan-300 border border-cyan-400' : 'text-cyan-600'}`}>{n.label}</button>
                      ))}
                    </nav>
                  </header>

                  <main className="max-w-6xl mx-auto px-4 py-10 w-full flex-1">
                    {safeTab === 'ranking' && <RankingTab teamScores={teamScores} completedTasks={completedTasks} teams={teams} rankingHidden={rankingHidden} canSeeTeam={canSeeTeam} showTaskPoints={isAdmin} />}
                    {safeTab === 'quadro' && <QuestBoardTab pendingTasks={pendingTasks} settings={settings} />}
                    {safeTab === 'tribos' && <TribosTab teamScores={teamScores} teams={teams} allTasks={tasks} penalties={penalties} onUpdateTeam={handleUpdateTeam} currentUser={currentUser} rankingHidden={rankingHidden} canSeeTeam={canSeeTeam} showToast={showToast} />}
                    {safeTab === 'timers' && <TimersTab timers={timers} startTimer={startTimer} pauseTimer={pauseTimer} resetTimer={resetTimer} startAllTimers={startAllTimers} stopAllTimers={stopAllTimers} resetAllTimers={resetAllTimers} teams={teams} currentUser={currentUser} />}
                    {safeTab === 'admin' && isAdmin && <AdminTab pendingTasks={pendingTasks} completedTasks={completedTasks} onCreateTask={handleCreateTask} onDeleteTask={handleDeleteTask} onCompleteTask={handleCompleteTask} onRenameTask={handleRenameTask} showToast={showToast} onLogout={handleLogout} teams={teams} settings={settings} onToggleVisibility={handleToggleVisibility} onUpdateMessage={handleUpdateMessage} penalties={penalties} onAddPenalty={handleAddPenalty} onDeletePenalty={handleDeletePenalty} bonus={bonus} onAddBonus={handleAddBonus} onDeleteBonus={handleDeleteBonus} onExport={handleExport} onImportData={handleImportData} onResetEvent={handleResetEvent} />}
                  </main>
                </div>
              )}
              <ToastNotification toast={toast} />
            </div>
          );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
