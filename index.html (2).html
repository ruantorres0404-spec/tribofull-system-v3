          const cleaned = className.replace(/(?:^|\s)[wh]-\d+(?:\.\d+)?(?=\s|$)/g, '');
          return <i aria-hidden="true" className={`fa-solid ${name} inline-block leading-none ${cleaned}`} style={size ? { fontSize: size } : undefined}></i>;

            leader: 'Líder Flock', participants: [{ name: 'Membro 1', role: 'Caçador' }, { name: 'Membro 2', role: 'Caçador' }],
            description: 'Tribo azul, voando alto com visão estratégica e precisão absoluta.' },
          { id: 'C', name: 'Bold', color: 'bg-orange-500/80', text: 'text-orange-400', lightBg: 'bg-orange-950/40',
            fireGlow: '0 0 25px rgba(249, 115, 22, 0.5), inset 0 0 15px rgba(249, 115, 22, 0.2)', fireBorder: 'rgba(249, 115, 22, 0.7)',
            leader: 'Líder Bold', participants: [{ name: 'Membro 1', role: 'Caçador' }, { name: 'Membro 2', role: 'Caçador' }],
            description: 'Tribo laranja, destemida e corajosa, enfrentando todos os desafios de frente.' },
          { id: 'D', name: 'Burn', color: 'bg-red-600/80', text: 'text-red-400', lightBg: 'bg-red-950/40',
            fireGlow: '0 0 25px rgba(220, 38, 38, 0.5), inset 0 0 15px rgba(220, 38, 38, 0.2)', fireBorder: 'rgba(220, 38, 38, 0.7)',
            leader: 'Líder Burn', participants: [{ name: 'Membro 1', role: 'Caçador' }, { name: 'Membro 2', role: 'Caçador' }],
            description: 'Tribo vermelha, consumindo os obstáculos com a força e fúria das chamas.' },
        ];

        const TEAM_IDS = ['A', 'B', 'C', 'D'];
        const IDLE_TIMER = { time: 0, isRunning: false, lastStart: 0 };
        const makeTimers = () => ({ A: { ...IDLE_TIMER }, B: { ...IDLE_TIMER }, C: { ...IDLE_TIMER }, D: { ...IDLE_TIMER } });
        const DEFAULT_SETTINGS = { isRankingVisible: true, systemMessage: 'O Sistema aguarda o despertar de vocês.' };

        const KEYS = {
          tasks: 'gincana_tasks_local', penalties: 'gincana_penalties_local', teams: 'gincana_teams_local',
          settings: 'gincana_settings_local', timers: 'gincana_timers_local', session: 'gincana_session_local',
          bonus: 'gincana_bonus_local',
        };

        // ==========================================
        // ARMAZENAMENTO SEGURO (try/catch em tudo)
        // ==========================================
        const store = {
          load(key, fallback) {
            try {
              const raw = localStorage.getItem(key);
              return raw ? JSON.parse(raw) : fallback;
            } catch (e) { return fallback; }
          },
          save(key, value) {
            try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { /* storage cheio/bloqueado */ }
          },
        };

        // Afinidades de cada membro (0 a 10), definidas pelo líder da tribo
        const AFFINITIES = [
          { key: 'forca', label: 'Força', short: 'FOR', Icon: HandFist },
          { key: 'velocidade', label: 'Velocidade', short: 'VEL', Icon: Gauge },
          { key: 'resistencia', label: 'Resistência', short: 'RES', Icon: Shield },
          { key: 'inteligencia', label: 'Inteligência', short: 'INT', Icon: Brain },
        ];
        const clampAff = (v) => { const n = Math.round(Number(v)); return Number.isFinite(n) ? Math.min(10, Math.max(0, n)) : 0; };
        const normalizeAffinity = (a) => { const out = {}; AFFINITIES.forEach(({ key }) => { out[key] = clampAff(a && a[key]); }); return out; };

        const normalizeParticipants = (list) =>
          asArray(list).map(p => typeof p === 'string'
            ? { name: p, role: 'Caçador', affinity: normalizeAffinity(null) }
            : { name: String(p?.name ?? ''), role: p?.role || 'Caçador', affinity: normalizeAffinity(p?.affinity) });

        // Mescla dados salvos com o visual padrão; guarda só os campos editáveis
        const mergeTeams = (saved) =>
          DEFAULT_TEAM_CONFIG.map(def => {
            const s = asArray(saved).find(t => t && t.id === def.id);
            if (!s) return def;
            return {
              ...def,
              name: (s.name || def.name),
              leader: s.leader ?? def.leader,
              description: s.description ?? def.description,
              participants: normalizeParticipants(s.participants),
            };
          });

        const EDITABLE_TEAM_FIELDS = ({ id, name, leader, description, participants }) => ({ id, name, leader, description, participants });

        const loadSession = () => {
          const s = store.load(KEYS.session, null);
          if (s && ['admin', 'leader', 'hunter'].includes(s.role)) return { role: s.role, tribeId: TEAM_IDS.includes(s.tribeId) ? s.tribeId : null };
          return null;
        };

        // ==========================================
        // FIREBASE: COLE AQUI A CONFIGURAÇÃO DO SEU PROJETO
        // (Console Firebase > Configurações do projeto > Seus apps > Web).
        // Enquanto databaseURL tiver "COLE_AQUI", o sistema roda em MODO LOCAL (sem compartilhar).
        // ==========================================
        const FIREBASE_CONFIG = {
          databaseURL: 'https://tribofull-system-default-rtdb.firebaseio.com',
          projectId: 'tribofull-system',
        };
        const DB_ROOT = 'tribofull'; // troque (ex.: 'tribofull_evento2') para começar um evento novo sem apagar o antigo

        let db = null;
        try {
          const url = String(FIREBASE_CONFIG.databaseURL || '');
          if (url && !url.includes('COLE_AQUI') && typeof firebase !== 'undefined') {
            firebase.initializeApp(FIREBASE_CONFIG);
            db = firebase.database();
          }
        } catch (e) { console.error('Falha ao iniciar o Firebase:', e); db = null; }
        const SHARED = !!db;

        // Hora do servidor (evita cronômetros diferentes por relógio errado nos aparelhos)
        let serverOffset = 0;
        const serverNow = () => Date.now() + serverOffset;

        // Firebase transforma listas em objetos e apaga listas vazias; isto normaliza na leitura
        const asArray = (v) => Array.isArray(v) ? v : (v && typeof v === 'object' ? Object.values(v) : []);
        const normalizeTasks = (v) => asArray(v).filter(Boolean).map(t => ({ ...t, results: asArray(t.results) }));
        const normalizePenalties = (v) => asArray(v).filter(Boolean);
        const normalizeBonus = (v) => asArray(v).filter(Boolean);
        const normalizeTeams = (v) => mergeTeams(v);
        const normalizeSettings = (v) => v && typeof v === 'object' ? { ...DEFAULT_SETTINGS, ...v } : DEFAULT_SETTINGS;
        const normalizeTimers = (v) => {
          const src = v && typeof v === 'object' ? v : {};
          const out = {};
          TEAM_IDS.forEach(id => { out[id] = { ...IDLE_TIMER, ...(src[id] || {}) }; });
          return out;
        };
        const serializeTeams = (list) => list.map(EDITABLE_TEAM_FIELDS);

        // Estado compartilhado: lê/escuta do Firebase e grava a cada mudança.
        // Sem Firebase configurado, usa o localStorage (modo local).
        function useShared(key, normalize, serialize = (x) => x) {
          const [value, setValue] = useState(() => normalize(SHARED ? undefined : store.load(KEYS[key], undefined)));
          const [ready, setReady] = useState(!SHARED);
          const latest = useRef(value);

          useEffect(() => {
            if (!SHARED) return;
            const r = db.ref(`${DB_ROOT}/${key}`);
            const cb = r.on('value', (snap) => {
              const n = normalize(snap.val());
              latest.current = n;
              setValue(n);
              setReady(true);
            }, (err) => { console.error('Erro de leitura no Firebase:', err); window.dispatchEvent(new CustomEvent('tribofull-error', { detail: 'read' })); });
            return () => r.off('value', cb);
          }, []);

          const update = useCallback((next) => {
            const n = typeof next === 'function' ? next(latest.current) : next;
            latest.current = n;
            setValue(n);
            const out = serialize(n);
            if (SHARED) {
              db.ref(`${DB_ROOT}/${key}`).set(JSON.parse(JSON.stringify(out)))
                .catch((err) => { console.error('Erro de gravação no Firebase:', err); window.dispatchEvent(new CustomEvent('tribofull-error', { detail: 'write' })); });
            } else {
              store.save(KEYS[key], out);
            }
          }, []);

          return [value, update, ready];
        }

        const ConnectingScreen = () => {
          const [slow, setSlow] = useState(false);
          useEffect(() => { const id = setTimeout(() => setSlow(true), 8000); return () => clearTimeout(id); }, []);
          return (
            <div className="min-h-screen flex items-center justify-center p-4 relative z-10">
              <div className="solo-panel p-8 rounded-2xl max-w-md w-full text-center">
                <Zap className="w-12 h-12 text-cyan-400 mx-auto mb-4 drop-shadow-[0_0_12px_rgba(6,182,212,0.8)] animate-pulse" />
                <p className="text-cyan-300 font-mono text-xs uppercase tracking-widest">❯❯ SINCRONIZANDO COM O SISTEMA ❮❮</p>
                {slow && <p className="text-amber-400 font-mono text-xs mt-4 leading-relaxed">Demorando mais que o normal. Verifique a internet. Se persistir, confira a configuração do Firebase e as regras do banco.</p>}
              </div>
            </div>
          );
        };

        const ModeBadge = ({ online }) => {
          const cfg = !SHARED
            ? { cls: 'text-amber-300 border-amber-500/50 bg-amber-950/40', dot: 'bg-amber-400', text: 'MODO LOCAL' }
            : online
              ? { cls: 'text-cyan-300 border-cyan-500/50 bg-cyan-950/40', dot: 'bg-cyan-400 animate-pulse', text: 'AO VIVO' }
              : { cls: 'text-red-300 border-red-500/50 bg-red-950/40', dot: 'bg-red-400', text: 'SEM CONEXÃO' };
          return (
            <span className={`hidden sm:inline-flex items-center gap-2 px-2.5 py-1 rounded border font-mono text-[10px] font-bold tracking-widest ${cfg.cls}`} title={!SHARED ? 'Os dados NÃO estão sendo compartilhados entre aparelhos' : undefined}>
              <span className={`w-1.5 h-1.5 rounded-full ${cfg.dot}`}></span>{cfg.text}
            </span>
          );
        };

        // ==========================================
        // MODAL ACESSÍVEL (Esc e clique fora fecham)
        // ==========================================
        const Modal = ({ onClose, labelledBy, className = '', style, children }) => {
          useEffect(() => {
            const onKey = (e) => { if (e.key === 'Escape') onClose(); };
            window.addEventListener('keydown', onKey);
            return () => window.removeEventListener('keydown', onKey);
          }, [onClose]);
          return (
            <div className="fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-50 flex items-center justify-center p-4 animate-fade-in" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
              <div role="dialog" aria-modal="true" aria-labelledby={labelledBy} className={className} style={style}>{children}</div>
            </div>
          );
        };

        const ConfirmModal = ({ confirm, onClose }) => {
          if (!confirm.show) return null;
          return (
            <Modal onClose={onClose} labelledBy="confirm-title" className="solo-panel rounded-xl p-6 max-w-sm w-full shadow-2xl animate-fade-in-up border border-cyan-500/60 relative">
              <h3 id="confirm-title" className="text-sm font-montserrat font-bold text-cyan-300 mb-3 uppercase tracking-widest flex items-center gap-2"><AlertTriangle className="w-4 h-4 text-cyan-400" /> [ALERTA DO SISTEMA]</h3>
              <p className="text-cyan-600 font-inter text-sm mb-8">{confirm.message}</p>
              <div className="flex gap-3 justify-end">
                <button onClick={onClose} className="px-4 py-2 rounded font-montserrat font-bold text-xs text-cyan-500 hover:text-cyan-300 hover:bg-cyan-950/40 border border-cyan-900 uppercase">Cancelar</button>
                <button onClick={confirm.onConfirm} className="px-5 py-2 rounded font-montserrat font-bold text-xs text-slate-950 bg-cyan-500 hover:bg-cyan-400 shadow-[0_0_12px_rgba(6,182,212,0.6)] uppercase">Confirmar</button>
              </div>
            </Modal>
          );
        };

        const ToastNotification = ({ toast }) => {
          if (!toast.show) return null;
          return (
            <div role="status" aria-live="polite" className="fixed bottom-6 right-6 z-[60] animate-fade-in-up">
              <div className={`flex items-center gap-3 px-5 py-3 rounded shadow-2xl font-montserrat font-bold text-xs uppercase tracking-widest border backdrop-blur-md ${toast.type === 'success' ? 'bg-cyan-950/90 border-cyan-400 text-cyan-300 shadow-[0_0_15px_rgba(6,182,212,0.5)]' : 'bg-red-950/90 border-red-500 text-red-300 shadow-[0_0_15px_rgba(239,68,68,0.5)]'}`}>
                {toast.type === 'success' ? <CheckCircle className="w-4 h-4 text-cyan-400" /> : <AlertTriangle className="w-4 h-4 text-red-400" />}
                {toast.message}
              </div>
            </div>
          );
        };

        // ==========================================
        // QUADRO
        // ==========================================
        const QuestBoardTab = ({ pendingTasks, settings }) => (
          <div className="space-y-10 animate-fade-in relative z-10">
            <section className="solo-panel p-6 sm:p-10 rounded-xl relative border-l-4 border-l-cyan-400">
              <h2 className="text-sm font-montserrat font-bold text-cyan-300 mb-4 flex items-center gap-2 uppercase tracking-widest"><MessageSquare className="w-5 h-5 text-cyan-400" /> Aviso do Sistema</h2>
              <div className="p-4 bg-slate-900/60 rounded border border-cyan-500/20 shadow-[inset_0_0_15px_rgba(6,182,212,0.1)]">
                <p className="text-cyan-100 font-inter leading-relaxed whitespace-pre-wrap">{settings.systemMessage || 'Nenhum aviso do Monarca no momento.'}</p>
              </div>
            </section>

            <section>
              <h2 className="text-lg sm:text-xl font-montserrat font-bold text-cyan-300 uppercase tracking-widest mb-6 flex items-center gap-3"><Scroll className="w-5 h-5 text-cyan-400" /> [MASMORRAS PENDENTES]</h2>
              {pendingTasks.length === 0 ? (
                <div className="text-center py-16 bg-slate-900/60 rounded-lg border border-cyan-500/20">
                  <Shield className="w-10 h-10 text-cyan-600/50 mx-auto mb-4 animate-pulse" />
                  <p className="text-cyan-500/70 font-mono text-xs tracking-widest uppercase">Nenhuma masmorra detectada no radar.</p>
                </div>
              ) : (
                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                  {pendingTasks.map(task => (
                    <div key={task.id} className="solo-panel p-6 rounded-xl border border-red-500/30 shadow-[0_0_15px_rgba(239,68,68,0.1)] hover:border-red-400/50 transition-colors relative overflow-hidden group">
                      <div className="absolute top-0 right-0 bg-red-950/80 text-red-400 text-[10px] font-mono font-bold px-3 py-1 border-b border-l border-red-500/30 uppercase tracking-widest">Ameaça Iminente</div>
                      <div className="flex items-center gap-3 mb-2 mt-2">
                        <Swords className="w-5 h-5 text-red-400 drop-shadow-[0_0_8px_rgba(239,68,68,0.6)]" />
                        <h3 className="font-montserrat font-bold text-red-100 uppercase tracking-wide text-lg">{task.name}</h3>
                      </div>
                      <p className="text-slate-400 font-mono text-xs mt-4 group-hover:text-cyan-300 transition-colors">❯❯ STATUS: AGUARDANDO CAÇADORES...</p>
                    </div>
                  ))}
                </div>
              )}
            </section>
          </div>
        );

        // ==========================================
        // RANKING
        // ==========================================
        const RankingTab = ({ teamScores, completedTasks, teams, rankingHidden, canSeeTeam, showTaskPoints }) => {
          const podiumOrder = [
            { rank: 2, team: teamScores[1] || teamScores[0], height: 'h-32 sm:h-48', iconColor: 'text-slate-300' },
            { rank: 1, team: teamScores[0], height: 'h-40 sm:h-64', iconColor: 'text-cyan-400' },
            { rank: 3, team: teamScores[2] || teamScores[0], height: 'h-24 sm:h-36', iconColor: 'text-teal-600' },
            { rank: 4, team: teamScores[3] || teamScores[0], height: 'h-16 sm:h-24', iconColor: 'text-slate-500' },
          ];

          return (
            <div className="space-y-12 animate-fade-in relative z-10">
              <section className="solo-panel p-6 sm:p-10 rounded-xl relative">
                <div className="absolute top-0 left-0 w-3 h-3 border-t-2 border-l-2 border-cyan-400"></div>
                <div className="absolute top-0 right-0 w-3 h-3 border-t-2 border-r-2 border-cyan-400"></div>
                <div className="absolute bottom-0 left-0 w-3 h-3 border-b-2 border-l-2 border-cyan-400"></div>
                <div className="absolute bottom-0 right-0 w-3 h-3 border-b-2 border-r-2 border-cyan-400"></div>

                <h2 className="text-xl sm:text-2xl font-montserrat font-bold text-center text-cyan-300 mb-2 uppercase tracking-[0.25em] drop-shadow-[0_0_10px_rgba(6,182,212,0.5)]">[RANKING DE TRIBOS]</h2>
                <p className="text-center text-cyan-600/80 font-mono text-xs tracking-widest mb-1">❯❯ STATUS DAS GUILDAS EM TEMPO REAL ❮❮</p>
                {!rankingHidden && <p className="text-center text-cyan-700 font-mono text-[10px] tracking-widest mb-10 uppercase">Desempate: mais 1º lugares</p>}

                {rankingHidden ? (
                  <div className="text-center py-20 bg-slate-950/80 rounded-lg border border-cyan-500/20 relative overflow-hidden mt-10">
                    <div className="absolute inset-0 bg-[repeating-linear-gradient(45deg,transparent,transparent_10px,rgba(6,182,212,0.05)_10px,rgba(6,182,212,0.05)_20px)]"></div>
                    <Lock className="w-12 h-12 text-cyan-600/50 mx-auto mb-6 animate-pulse relative z-10" />
                    <p className="text-cyan-400 font-montserrat font-bold text-lg tracking-widest uppercase relative z-10 drop-shadow-[0_0_8px_rgba(6,182,212,0.5)]">[CLASSIFICAÇÃO RESTRITA PELO SISTEMA]</p>
                    <p className="text-cyan-600/70 font-mono text-xs mt-3 uppercase tracking-widest relative z-10">O Monarca ainda não revelou os resultados.</p>
                  </div>
                ) : completedTasks.length !== 0 ? (
                  <div className="flex justify-center items-end gap-2 sm:gap-6 mt-12 mb-4 px-2">
                    {podiumOrder.map((pos) => (
                      <div key={pos.rank} className="flex flex-col items-center w-20 sm:w-32">
                        <div className="flex flex-col items-center mb-4">
                          <Award className={`w-6 h-6 sm:w-8 sm:h-8 mb-2 ${pos.iconColor} drop-shadow-[0_0_8px_rgba(6,182,212,0.8)]`} />
                          <span className={`font-montserrat font-bold text-[10px] sm:text-xs text-center ${pos.team.text} uppercase tracking-wider whitespace-nowrap`}>{pos.team.name}</span>
                          <span className="font-mono font-bold text-cyan-200 text-sm sm:text-lg mt-1 drop-shadow-[0_0_5px_rgba(6,182,212,0.5)]">{pos.team.points} XP</span>
                        </div>
                        <div className={`w-full ${pos.team.color} ${pos.height} rounded-t-sm shadow-[0_0_15px_rgba(6,182,212,0.3)] border-t border-l border-r border-cyan-400/40 flex justify-center pt-3 sm:pt-5 transition-all duration-500 relative overflow-hidden`}>
                          <div className="absolute inset-0 bg-gradient-to-b from-cyan-400/20 to-transparent"></div>
                          <span className="text-white font-montserrat font-bold text-xl sm:text-2xl opacity-90 relative z-10">{pos.rank}</span>
                        </div>
                      </div>
                    ))}
                  </div>
                ) : (
                  <div className="text-center py-16 bg-slate-900/60 rounded-lg border border-cyan-500/20 mt-10">
                    <Shield className="w-10 h-10 text-cyan-600/50 mx-auto mb-4 animate-pulse" />
                    <p className="text-cyan-500/70 font-mono text-xs tracking-widest uppercase">[NENHUMA MASMORRA CONCLUÍDA AINDA]</p>
                  </div>
                )}
              </section>

              <section>
                <div className="flex items-center gap-3 mb-6">
                  <History className="w-5 h-5 text-cyan-400" />
                  <h2 className="text-lg sm:text-xl font-montserrat font-bold text-cyan-300 uppercase tracking-widest">[HISTÓRICO DE PROVAS]</h2>
                </div>
                {completedTasks.length === 0 ? (
                  <p className="text-cyan-600/70 text-center py-8 solo-panel rounded-lg font-mono text-xs uppercase tracking-widest">Nenhum registro de combate encontrado.</p>
                ) : (
                  <div className="space-y-4">
                    {completedTasks.map(task => {
                      const results = [...(task.results || [])];
                      // Oculto: ordem fixa das tribos (não revela a colocação pela ordem dos cards)
                      if (rankingHidden) results.sort((a, b) => TEAM_IDS.indexOf(a.teamId) - TEAM_IDS.indexOf(b.teamId));
                      else results.sort((a, b) => a.place - b.place);
                      return (
                        <div key={task.id} className="solo-panel rounded-xl overflow-hidden transition-all hover:border-cyan-500/50">
                          <div className="bg-slate-900/80 px-5 py-4 border-b border-cyan-500/20 flex items-center justify-between">
                            <h3 className="font-montserrat font-bold text-sm sm:text-base text-cyan-200 uppercase tracking-wide">{task.name}</h3>
                            <div className="flex items-center gap-2 text-cyan-400 bg-cyan-950/60 px-3 py-1 rounded text-xs font-mono font-bold tracking-widest border border-cyan-500/40 shadow-[0_0_8px_rgba(6,182,212,0.3)]">
                              <CheckCircle className="w-3.5 h-3.5" /> LIMPA
                            </div>
                          </div>
                          <div className="p-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 bg-slate-950/50">
                            {results.map(result => {
                              const team = teams.find(t => t.id === result.teamId);
                              if (!team) return null;
                              const visible = canSeeTeam(team.id);
                              return (
                                <div key={result.teamId} className={`flex items-center gap-4 p-3 rounded-lg border-l-2 ${team.lightBg} border-l-cyan-400 border border-cyan-900/40 opacity-90`}>
                                  <div className="font-montserrat font-bold text-xl text-cyan-600 w-8">{visible ? `#${result.place}` : '#?'}</div>
                                  <div>
                                    <div className={`font-inter font-bold text-xs uppercase tracking-wider ${team.text}`}>{team.name}</div>
                                    <div className="text-cyan-200 font-mono text-sm">{visible && showTaskPoints ? `${result.points} XP` : '??? XP'}</div>
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </section>
            </div>
          );
        };

        // ==========================================
        // TRIBOS
        // ==========================================
        const ROLE_OPTIONS = ['Caçador', 'Tanque', 'Mago', 'Assassino', 'Curandeiro'];

        const AffinityBars = ({ affinity }) => {
          const aff = normalizeAffinity(affinity);
          return (
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-x-4 gap-y-1.5 mt-2.5">
              {AFFINITIES.map(a => (
                <div key={a.key} className="flex items-center gap-2" title={`${a.label}: ${aff[a.key]}/10`}>
                  <a.Icon className="w-3 h-3 text-cyan-500" />
                  <span className="font-mono text-[10px] text-cyan-600 w-7">{a.short}</span>
                  <div className="flex-1 h-1.5 bg-slate-900 rounded-full overflow-hidden border border-cyan-900/40"><div className="h-full bg-cyan-400/80" style={{ width: `${aff[a.key] * 10}%` }}></div></div>
                  <span className="font-mono text-[10px] text-cyan-300 w-5 text-right">{aff[a.key]}</span>
                </div>
              ))}
            </div>
          );
        };

        const TribosTab = ({ teamScores, teams, allTasks, penalties, onUpdateTeam, currentUser, rankingHidden, canSeeTeam, showToast }) => {
          const [selectedId, setSelectedId] = useState(null);
          const [isEditing, setIsEditing] = useState(false);
          const [editForm, setEditForm] = useState(null);
          const [isEditingAff, setIsEditingAff] = useState(false);
          const [affForm, setAffForm] = useState([]);
          // Líderes e caçadores nunca veem os pontos de cada prova; só o admin
          const showTaskPoints = currentUser.role === 'admin';

          // Oculto: ordem fixa das tribos (não revela o ranking pela ordem dos cards)
          const ordered = rankingHidden ? teams.map(t => teamScores.find(s => s.id === t.id)).filter(Boolean) : teamScores;
          const selected = selectedId ? teamScores.find(t => t.id === selectedId) : null;

          const handleOpenModal = (team) => {
            setSelectedId(team.id);
            setEditForm(JSON.parse(JSON.stringify(EDITABLE_TEAM_FIELDS(team))));
            setIsEditing(false);
            setIsEditingAff(false);
          };
          const closeModal = useCallback(() => { setSelectedId(null); setIsEditing(false); setIsEditingAff(false); }, []);

          const openAffEditor = () => { setAffForm(selected.participants.map(p => normalizeAffinity(p.affinity))); setIsEditing(false); setIsEditingAff(true); };
          const setAff = (idx, key, value) => setAffForm(f => f.map((x, i) => i === idx ? { ...x, [key]: clampAff(value) } : x));
          const handleSaveAff = () => {
            onUpdateTeam({ ...EDITABLE_TEAM_FIELDS(selected), participants: selected.participants.map((p, i) => ({ ...p, affinity: normalizeAffinity(affForm[i]) })) });
            setIsEditingAff(false);
          };

          const handleParticipantChange = (index, field, value) => {
            setEditForm(f => ({ ...f, participants: f.participants.map((p, i) => i === index ? { ...p, [field]: value } : p) }));
          };
          const handleAddParticipant = () => setEditForm(f => ({ ...f, participants: [...f.participants, { name: '', role: 'Caçador' }] }));
          const handleRemoveParticipant = (index) => setEditForm(f => ({ ...f, participants: f.participants.filter((_, i) => i !== index) }));

          const handleSaveTeam = () => {
            const name = editForm.name.trim();
            if (!name) { showToast('O nome da tribo não pode ficar vazio.'); return; }
            const participants = editForm.participants.map(p => ({ ...p, name: p.name.trim() })).filter(p => p.name);
            onUpdateTeam({ ...editForm, name, leader: editForm.leader.trim(), description: editForm.description.trim(), participants });
            setIsEditing(false);
          };

          const canEditTeam = (teamId) => currentUser.role === 'admin' || (currentUser.role === 'leader' && currentUser.tribeId === teamId);

          return (
            <div className="animate-fade-in space-y-8 relative z-10">
              <div className="text-center mb-10">
                <h2 className="text-xl sm:text-2xl font-montserrat font-bold text-cyan-300 uppercase tracking-[0.25em] mb-2 drop-shadow-[0_0_8px_rgba(6,182,212,0.5)]">[STATUS DE TRIBOS]</h2>
                <p className="text-cyan-600 font-mono text-xs tracking-widest">❯❯ CLIQUE EM UMA GUILDA PARA ACESSAR DETALHES ❮❮</p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                {ordered.map(team => {
                  const visible = canSeeTeam(team.id);
                  return (
                    <div key={team.id} role="button" tabIndex={0} aria-label={`Abrir dossiê da tribo ${team.name}`}
                      onClick={() => handleOpenModal(team)}
                      onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handleOpenModal(team); } }}
                      className="solo-panel rounded-xl p-6 flex flex-col justify-between transition-all duration-300 hover:scale-[1.01] cursor-pointer group relative" style={{ boxShadow: team.fireGlow, borderColor: team.fireBorder }}>
                      <div className="absolute top-2 right-2 w-2 h-2 border-t border-r border-cyan-400 group-hover:scale-125 transition-transform"></div>
                      <div>
                        <div className="flex items-center justify-between mb-5">
                          <div className="flex items-center gap-4">
                            <div className="w-10 h-10 rounded bg-slate-900 border border-cyan-500/40 flex items-center justify-center shadow-[0_0_10px_rgba(6,182,212,0.3)]">
                              <Users className={`w-5 h-5 ${team.text}`} />
                            </div>
                            <h3 className={`text-lg font-montserrat font-bold uppercase tracking-widest ${team.text}`}>{team.name}</h3>
                          </div>
                          <ChevronRight className="w-5 h-5 text-cyan-500 group-hover:translate-x-1 transition-transform" />
                        </div>
                        <p className="text-cyan-600/90 mb-8 font-inter text-sm font-light leading-relaxed border-l border-cyan-500/30 pl-4">{team.description}</p>
                      </div>
                      <div className="grid grid-cols-2 gap-4 bg-slate-950 p-4 rounded-lg border border-cyan-900/60 relative overflow-hidden">
                        {!visible && <div className="absolute inset-0 bg-slate-950/80 backdrop-blur-[2px] z-10 flex items-center justify-center border border-cyan-900/50"><Lock className="w-4 h-4 text-cyan-600 mr-2" /><span className="text-cyan-500 font-mono text-xs uppercase">Restrito</span></div>}
                        <div className="text-center">
                          <div className="text-[10px] font-montserrat font-bold text-cyan-600 uppercase tracking-widest mb-1">XP Total</div>
                          <div className="text-2xl font-mono font-bold text-cyan-200 drop-shadow-[0_0_5px_rgba(6,182,212,0.4)]">{visible ? team.points : '???'}</div>
                        </div>
                        <div className="text-center border-l border-cyan-900/60">
                          <div className="text-[10px] font-montserrat font-bold text-cyan-600 uppercase tracking-widest mb-1">Média / Prova</div>
                          <div className="text-2xl font-mono font-bold text-cyan-400">{visible && !rankingHidden ? team.average : '???'}</div>
                        </div>
                      </div>
                    </div>
                  );
                })}
              </div>

              {selected && editForm && (
                <Modal onClose={closeModal} labelledBy="team-modal-title" className="solo-panel rounded-xl p-6 sm:p-8 max-w-lg w-full shadow-2xl animate-fade-in-up border relative max-h-[90vh] overflow-y-auto" style={{ boxShadow: selected.fireGlow, borderColor: selected.fireBorder }}>
                  <div className="flex justify-between items-start mb-6">
                    <div className="flex-1 mr-4">
                      <div className="text-xs font-montserrat font-bold text-cyan-600 uppercase tracking-widest">[DOSSIÊ DA GUILDA]</div>
                      {!isEditing ? (
                        <h3 id="team-modal-title" className={`text-xl font-montserrat font-bold uppercase tracking-wider ${selected.text} mt-1 break-words`}>{selected.name}</h3>
                      ) : (
                        <input id="team-modal-title" aria-label="Nome da tribo" type="text" value={editForm.name} onChange={(e) => setEditForm({ ...editForm, name: e.target.value })} className="mt-1 w-full px-3 py-1.5 rounded bg-slate-900 border border-cyan-500/50 text-cyan-200 outline-none font-montserrat font-bold text-lg uppercase tracking-wider" placeholder="Nome da Tribo" />
                      )}
                    </div>
                    <div className="flex items-center gap-2">
                      {!isEditing && !isEditingAff && canEditTeam(selected.id) && (
                        <button aria-label="Editar tribo" onClick={() => { setEditForm(JSON.parse(JSON.stringify(EDITABLE_TEAM_FIELDS(selected)))); setIsEditing(true); }} className="text-cyan-500 hover:text-cyan-300 p-1.5 hover:bg-cyan-950/50 rounded transition-colors"><Edit className="w-5 h-5" /></button>
                      )}
                      <button aria-label="Fechar" onClick={closeModal} className="text-cyan-500 hover:text-cyan-300 p-1.5 hover:bg-cyan-950/50 rounded transition-colors"><X className="w-6 h-6" /></button>
                    </div>
                  </div>

                  <div className="space-y-6">
                    <div className="bg-slate-900/80 p-4 rounded-lg border border-cyan-500/30">
                      <div className="flex items-center gap-2 text-xs font-montserrat font-bold text-cyan-400 uppercase tracking-widest mb-2"><UserCheck className="w-4 h-4" /> Líder da Tribo</div>
                      {!isEditing ? (
                        <div className="text-cyan-100 font-inter font-medium text-sm pl-6">{selected.leader}</div>
                      ) : (
                        <div className="pl-6">
                          <input aria-label="Nome do líder" type="text" value={editForm.leader} onChange={(e) => setEditForm({ ...editForm, leader: e.target.value })} className="w-full px-3 py-2 rounded bg-slate-950 border border-cyan-500/50 text-cyan-200 outline-none font-inter text-sm" placeholder="Nome do Líder" />
                        </div>
                      )}
                    </div>

                    <div className="bg-slate-900/80 p-4 rounded-lg border border-cyan-500/30">
                      <div className="flex items-center gap-2 text-xs font-montserrat font-bold text-cyan-400 uppercase tracking-widest mb-2"><Info className="w-4 h-4" /> Descrição</div>
                      {!isEditing ? (
                        <div className="text-cyan-100 font-inter font-medium text-sm pl-6">{selected.description}</div>
                      ) : (
                        <div className="pl-6">
                          <textarea aria-label="Descrição da tribo" value={editForm.description} onChange={(e) => setEditForm({ ...editForm, description: e.target.value })} className="w-full px-3 py-2 rounded bg-slate-950 border border-cyan-500/50 text-cyan-200 outline-none font-inter text-sm resize-none h-20" placeholder="Descrição da Tribo..." />
                        </div>
                      )}
                    </div>

                    <div className="bg-slate-900/80 p-4 rounded-lg border border-cyan-500/30">
                      <div className="flex items-center justify-between text-xs font-montserrat font-bold text-cyan-400 uppercase tracking-widest mb-3">
                        <span className="flex items-center gap-2"><Users className="w-4 h-4" /> Caçadores {!isEditing && `(${selected.participants.length})`}</span>
                        {!isEditing && !isEditingAff && canEditTeam(selected.id) && selected.participants.length > 0 && (
                          <button onClick={openAffEditor} className="flex items-center gap-1.5 px-2.5 py-1 rounded border border-cyan-500/40 text-cyan-300 hover:bg-cyan-950/60 text-[10px] font-mono tracking-widest transition-colors"><Zap className="w-3 h-3" /> AFINIDADES</button>
                        )}
                      </div>
                      {isEditingAff ? (
                        <div className="space-y-3 pl-0 sm:pl-4">
                          <p className="text-[11px] text-cyan-600 font-mono">Defina o nível de cada afinidade de 0 a 10.</p>
                          {selected.participants.map((pData, idx) => (
                            <div key={idx} className="bg-slate-950/60 p-3 rounded border border-cyan-900/30">
                              <div className="text-xs font-inter text-cyan-100 flex items-center gap-2 mb-3"><span className="w-1.5 h-1.5 bg-cyan-400 rounded-full"></span> {pData.name}</div>
                              <div className="space-y-2.5">
                                {AFFINITIES.map(a => (
                                  <div key={a.key} className="flex items-center gap-3">
                                    <span className="flex items-center gap-1.5 w-28 text-[11px] font-montserrat font-bold text-cyan-400 uppercase tracking-wider"><a.Icon className="w-3.5 h-3.5" /> {a.label}</span>
                                    <input type="range" min="0" max="10" step="1" aria-label={`${a.label} de ${pData.name}`} value={affForm[idx] ? affForm[idx][a.key] : 0} onChange={(e) => setAff(idx, a.key, e.target.value)} className="flex-1 accent-cyan-400" />
                                    <span className="w-6 text-right font-mono text-sm text-cyan-200">{affForm[idx] ? affForm[idx][a.key] : 0}</span>
                                  </div>
                                ))}
                              </div>
                            </div>
                          ))}
                        </div>
                      ) : !isEditing ? (
                        <div className="space-y-2 pl-4">
                          {selected.participants.map((pData, idx) => {
                            const RoleIcon = pData.role === 'Tanque' ? Shield : pData.role === 'Mago' ? Wand2 : pData.role === 'Assassino' ? Swords : pData.role === 'Curandeiro' ? HeartPulse : Crosshair;
                            const roleColor = pData.role === 'Tanque' ? 'text-amber-400' : pData.role === 'Mago' ? 'text-purple-400' : pData.role === 'Assassino' ? 'text-red-400' : pData.role === 'Curandeiro' ? 'text-emerald-400' : 'text-cyan-400';
                            return (
                              <div key={idx} className="bg-slate-950/60 p-2.5 rounded border border-cyan-900/30">
                                <div className="flex justify-between items-center">
                                  <div className="text-xs font-inter text-cyan-100 flex items-center gap-2"><span className="w-1.5 h-1.5 bg-cyan-400 rounded-full"></span> {pData.name}</div>
                                  <div className={`flex items-center gap-1.5 text-[10px] font-mono font-bold uppercase tracking-widest ${roleColor}`}><RoleIcon className="w-3.5 h-3.5" /> {pData.role}</div>
                                </div>
                                <AffinityBars affinity={pData.affinity} />
                              </div>
                            );
                          })}
                        </div>
                      ) : (
                        <div className="space-y-2 pl-4">
                          {editForm.participants.map((pData, idx) => (
                            <div key={idx} className="flex flex-col sm:flex-row items-start sm:items-center gap-2">
                              <input aria-label={`Nome do caçador ${idx + 1}`} type="text" value={pData.name} onChange={(e) => handleParticipantChange(idx, 'name', e.target.value)} className="flex-1 w-full px-3 py-1.5 rounded bg-slate-950 border border-cyan-500/50 text-cyan-200 outline-none font-inter text-xs" placeholder={`Caçador ${idx + 1}`} />
                              <div className="flex w-full sm:w-auto items-center gap-2">
                                <select aria-label={`Função do caçador ${idx + 1}`} value={pData.role} onChange={(e) => handleParticipantChange(idx, 'role', e.target.value)} className="flex-1 sm:w-28 px-2 py-1.5 rounded bg-slate-950 border border-cyan-500/50 text-cyan-400 outline-none font-mono text-[10px] uppercase">
                                  {ROLE_OPTIONS.map(r => <option key={r} value={r}>{r === 'Curandeiro' ? 'Curand.' : r}</option>)}
                                </select>
                                <button aria-label={`Remover caçador ${idx + 1}`} onClick={() => handleRemoveParticipant(idx)} className="text-red-400 hover:text-red-300 p-1.5 bg-red-950/30 rounded border border-red-900/50"><Trash2 className="w-4 h-4" /></button>
                              </div>
                            </div>
                          ))}
                          <button onClick={handleAddParticipant} className="mt-3 text-xs font-montserrat font-bold text-cyan-400 flex items-center gap-1 hover:text-cyan-200 transition-colors uppercase"><Plus className="w-3.5 h-3.5" /> Recrutar</button>
                        </div>
                      )}
                    </div>

                    {!isEditing && !isEditingAff && (
                      <div className="bg-slate-900/80 p-4 rounded-lg border border-cyan-500/30">
                        <div className="flex items-center gap-2 text-xs font-montserrat font-bold text-cyan-400 uppercase tracking-widest mb-3"><History className="w-4 h-4" /> Provas e Colocações</div>
                        <div className="space-y-2 max-h-48 overflow-y-auto pr-1">
                          {allTasks.filter(t => t.status === 'completed').length === 0 ? (
                            <p className="text-xs text-cyan-600 font-mono italic pl-6">Nenhuma prova concluída ainda.</p>
                          ) : (
                            allTasks.filter(t => t.status === 'completed').map(task => {
                              const res = task.results?.find(r => r.teamId === selected.id);
                              const visible = canSeeTeam(selected.id);
                              return (
                                <div key={task.id} className="flex justify-between items-center text-xs bg-slate-950 p-2.5 rounded border border-cyan-900/50">
                                  <span className="font-montserrat font-semibold text-cyan-200">{task.name}</span>
                                  {res ? (
                                    <div className="flex items-center gap-3">
                                      {visible && <span className="font-mono font-bold text-cyan-400">#{res.place}º Lugar</span>}
                                      <span className="font-mono text-cyan-300 bg-cyan-950 px-2 py-0.5 rounded border border-cyan-500/30">{visible && showTaskPoints ? `${res.points} XP` : '??? XP'}</span>
                                    </div>
                                  ) : <span className="text-slate-500 font-mono">Não participou</span>}
                                </div>
                              );
                            })
                          )}
                        </div>

                        {penalties.some(p => p.teamId === selected.id) && (
                          <div className="mt-4 pt-4 border-t border-red-900/40">
                            <div className="flex items-center gap-2 text-xs font-montserrat font-bold text-red-400 uppercase tracking-widest mb-3"><AlertTriangle className="w-4 h-4" /> Penalidades</div>
                            <div className="space-y-2 max-h-40 overflow-y-auto pr-1">
                              {penalties.filter(p => p.teamId === selected.id).map(p => (
                                <div key={p.id} className="flex justify-between items-center gap-3 text-xs bg-red-950/20 p-2.5 rounded border border-red-900/40">
                                  <span className="font-inter text-cyan-200">{canSeeTeam(selected.id) ? p.reason : 'Motivo restrito'}</span>
                                  <span className="font-mono font-bold text-red-400 whitespace-nowrap">{canSeeTeam(selected.id) ? `-${p.points} XP` : '-??? XP'}</span>
                                </div>
                              ))}
                            </div>
                          </div>
                        )}
                      </div>
                    )}

                    {isEditingAff && (
                      <div className="flex justify-end gap-3 pt-2">
                        <button onClick={() => setIsEditingAff(false)} className="px-4 py-2 rounded text-xs font-montserrat font-bold text-cyan-500 hover:text-cyan-300 border border-cyan-900 uppercase">Cancelar</button>
                        <button onClick={handleSaveAff} className="px-5 py-2 rounded text-xs font-montserrat font-bold text-slate-950 bg-cyan-500 hover:bg-cyan-400 shadow-[0_0_12px_rgba(6,182,212,0.6)] uppercase flex items-center gap-1.5"><Save className="w-4 h-4" /> Salvar Afinidades</button>
                      </div>
                    )}

                    {isEditing && (
                      <div className="flex justify-end gap-3 pt-2">
                        <button onClick={() => setIsEditing(false)} className="px-4 py-2 rounded text-xs font-montserrat font-bold text-cyan-500 hover:text-cyan-300 border border-cyan-900 uppercase">Cancelar</button>
                        <button onClick={handleSaveTeam} className="px-5 py-2 rounded text-xs font-montserrat font-bold text-slate-950 bg-cyan-500 hover:bg-cyan-400 shadow-[0_0_12px_rgba(6,182,212,0.6)] uppercase flex items-center gap-1.5"><Save className="w-4 h-4" /> Salvar Dossiê</button>
                      </div>
                    )}
                  </div>
                </Modal>
              )}
            </div>
          );
        };

        // ==========================================
        // CRONÔMETROS (todos veem; só o admin controla)
        // ==========================================
        const formatTime = (ms) => {
          const totalSeconds = Math.floor(ms / 1000);
          const minutes = Math.floor(totalSeconds / 60);
          const seconds = totalSeconds % 60;
          const centiseconds = Math.floor((ms % 1000) / 10);
          return `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}.${String(centiseconds).padStart(2, '0')}`;
        };

        const TimersTab = ({ timers, startTimer, pauseTimer, resetTimer, startAllTimers, stopAllTimers, resetAllTimers, teams, currentUser }) => {
          const safeTimers = timers || makeTimers();
          const anyRunning = Object.values(safeTimers).some(t => t?.isRunning);
          const [now, setNow] = useState(serverNow());

          // Só atualiza a tela (a cada 50 ms) enquanto algum cronômetro estiver rodando
          useEffect(() => {
            if (!anyRunning) return;
            setNow(serverNow());
            const id = setInterval(() => setNow(serverNow()), 50);
            return () => clearInterval(id);
          }, [anyRunning]);

          const elapsed = (t) => t.isRunning ? t.time + Math.max(0, now - t.lastStart) : t.time;
          const isAdmin = currentUser.role === 'admin';

          return (
            <div className="space-y-8 animate-fade-in relative z-10">
              <div className="text-center mb-6">
                <h2 className="text-xl sm:text-2xl font-montserrat font-bold text-cyan-300 uppercase tracking-[0.25em] mb-2 drop-shadow-[0_0_8px_rgba(6,182,212,0.5)]">[CRONÔMETROS DE TRIBOS]</h2>
                <p className="text-cyan-600 font-mono text-xs tracking-widest">❯❯ CONTROLE TEMPORAL DE COMBATE ❮❮</p>
              </div>

              {isAdmin && (
                <div className="solo-panel p-5 rounded-xl flex flex-wrap items-center justify-center gap-4">
                  <button onClick={startAllTimers} className="flex items-center gap-2 px-5 py-3 rounded-lg font-montserrat font-bold text-xs uppercase tracking-widest border border-cyan-400 bg-cyan-950/80 text-cyan-300 shadow-[0_0_15px_rgba(6,182,212,0.3)] hover:bg-cyan-900/80 transition-all"><Play className="w-4 h-4" /> <span>Iniciar Todos</span></button>
                  <button onClick={stopAllTimers} className="flex items-center gap-2 px-5 py-3 rounded-lg font-montserrat font-bold text-xs uppercase tracking-widest border border-amber-500 bg-amber-950/80 text-amber-300 shadow-[0_0_15px_rgba(245,158,11,0.3)] hover:bg-amber-900/80 transition-all"><Square className="w-4 h-4" /> <span>Pausar Todos</span></button>
                  <button onClick={resetAllTimers} className="flex items-center gap-2 px-5 py-3 rounded-lg font-montserrat font-bold text-xs uppercase tracking-widest bg-slate-900 text-cyan-500 border border-cyan-500/40 hover:bg-slate-800 transition-colors"><RotateCcw className="w-4 h-4" /> <span>Resetar Todos</span></button>
                </div>
              )}

              <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                {teams.map(team => {
                  const t = safeTimers[team.id] || IDLE_TIMER;
                  return (
                    <div key={team.id} className="solo-panel rounded-xl p-6 flex flex-col items-center justify-between relative group" style={{ boxShadow: team.fireGlow, borderColor: team.fireBorder }}>
                      <div className="absolute top-2 right-2 w-2 h-2 border-t border-r border-cyan-400"></div>
                      <h3 className={`text-lg font-montserrat font-bold uppercase tracking-widest mb-4 ${team.text}`}>{team.name}</h3>
                      <div className="bg-slate-950 px-8 py-5 rounded-xl border border-cyan-500/30 mb-6 shadow-[inset_0_0_15px_rgba(6,182,212,0.15)] w-full text-center">
                        <span className="font-mono text-3xl sm:text-4xl font-bold text-cyan-100 tracking-wider drop-shadow-[0_0_10px_rgba(6,182,212,0.6)]">{formatTime(elapsed(t))}</span>
                      </div>
                      {isAdmin && (
                        <div className="flex items-center gap-3 w-full">
                          <button onClick={() => startTimer(team.id)} className="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-lg font-montserrat font-bold text-xs uppercase tracking-widest border border-cyan-400 bg-cyan-950/80 text-cyan-300 shadow-[0_0_10px_rgba(6,182,212,0.4)] hover:bg-cyan-900/80 transition-all"><Play className="w-4 h-4" /> <span>Iniciar</span></button>
                          <button onClick={() => pauseTimer(team.id)} className="flex-1 flex items-center justify-center gap-2 py-2.5 rounded-lg font-montserrat font-bold text-xs uppercase tracking-widest border border-amber-500 bg-amber-950/80 text-amber-300 shadow-[0_0_10px_rgba(245,158,11,0.4)] hover:bg-amber-900/80 transition-all"><Square className="w-4 h-4" /> <span>Pausa</span></button>
                          <button aria-label="Resetar cronômetro" onClick={() => resetTimer(team.id)} className="px-4 py-2.5 rounded-lg font-montserrat font-bold text-xs bg-slate-900 text-cyan-500 border border-cyan-500/40 hover:bg-slate-800 transition-colors" title="Resetar"><RotateCcw className="w-4 h-4" /></button>
                        </div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        };

        // ==========================================
        // FORMULÁRIO DE RESULTADOS (cria e edita)
        // Aceita de 1 a 4 tribos; posição editável (permite empate de colocação).
        // ==========================================
        const TaskResultsForm = ({ teams, initialResults, onSave, onCancel, showToast, saveLabel = 'Concluir' }) => {
          const [rows, setRows] = useState(() => {
            const base = [1, 2, 3, 4].map(place => ({ place, teamId: '', points: '' }));
            if (initialResults && initialResults.length) {
              const sorted = [...initialResults].sort((a, b) => a.place - b.place);
              return base.map((r, i) => sorted[i] ? { place: sorted[i].place, teamId: sorted[i].teamId, points: String(sorted[i].points) } : r);
            }
            return base;
          });

          const update = (i, patch) => setRows(prev => prev.map((r, idx) => idx === i ? { ...r, ...patch } : r));

          const pointsOf = (r) => (r.points !== '' && Number.isFinite(Number(r.points))) ? Number(r.points) : null;
          // Teto da linha: a menor pontuação entre as tribos em colocação melhor (1º limita o 2º, o 2º limita o 3º...)
          const capOf = (row) => {
            const better = rows.filter(r => r.teamId && Number(r.place) < Number(row.place) && pointsOf(r) !== null).map(pointsOf);
            return better.length ? Math.min(...better) : null;
          };

          const submit = () => {
            if (rows.some(r => !r.teamId && r.points !== '')) { showToast('Selecione a tribo das linhas com pontos.'); return; }
            const filled = rows.filter(r => r.teamId);
            if (!filled.length) { showToast('Preencha ao menos uma tribo.'); return; }
            if (new Set(filled.map(r => r.teamId)).size !== filled.length) { showToast('Cada tribo só pode aparecer uma vez.'); return; }
            if (filled.some(r => r.points === '' || !Number.isFinite(Number(r.points)))) { showToast('Insira pontuações válidas.'); return; }
            const broken = filled.find(r => { const cap = capOf(r); return cap !== null && Number(r.points) > cap; });
            if (broken) { showToast(`O ${broken.place}º lugar não pode ter mais pontos que um lugar melhor (máx. ${capOf(broken)} XP).`); return; }
            onSave(filled.map(r => ({ place: Number(r.place), teamId: r.teamId, points: Number(r.points) })).sort((a, b) => a.place - b.place));
          };

          return (
            <div className="bg-slate-900/90 p-5 sm:p-7 rounded-lg border border-cyan-500/40 animate-fade-in shadow-[0_0_15px_rgba(6,182,212,0.2)]">
              <div className="flex justify-between items-center mb-2">
                <h4 className="font-montserrat font-bold text-sm text-cyan-300 flex items-center gap-2 uppercase tracking-widest"><Award className="w-4 h-4" /> Atribuir Colocação</h4>
                <button aria-label="Cancelar" onClick={onCancel} className="text-cyan-500 hover:text-cyan-300"><X className="w-5 h-5" /></button>
              </div>
              <p className="text-[11px] text-cyan-600 font-mono mb-5">Deixe a linha vazia para tribos que não participaram. A pontuação de cada colocação não pode ser maior que a de uma colocação melhor (o 1º tem a maior).</p>
              <div className="space-y-3">
                {rows.map((row, index) => { const cap = capOf(row); const pts = pointsOf(row); const over = cap !== null && pts !== null && pts > cap; return (
                  <div key={index} className="flex flex-col sm:flex-row items-center gap-3 bg-slate-950 p-3 rounded-lg border border-cyan-900/60">
                    <select aria-label={`Posição da linha ${index + 1}`} value={row.place} onChange={(e) => update(index, { place: Number(e.target.value) })} className="w-full sm:w-20 px-2 py-2.5 rounded-lg bg-slate-900 border border-cyan-500/40 text-cyan-400 outline-none font-montserrat font-bold text-sm text-center">
                      {[1, 2, 3, 4].map(n => <option key={n} value={n}>#{n}</option>)}
                    </select>
                    <select aria-label={`Tribo da linha ${index + 1}`} value={row.teamId} onChange={(e) => update(index, { teamId: e.target.value })} className="flex-1 px-3 py-2.5 rounded-lg bg-slate-900 border border-cyan-500/40 text-cyan-200 outline-none font-inter text-sm w-full">
                      <option value="">Selecionar Tribo...</option>
                      {teams.map(team => <option key={team.id} value={team.id} disabled={rows.some((r, i) => i !== index && r.teamId === team.id)}>{team.name}</option>)}
                    </select>
                    <div className="w-full sm:w-36">
                      <input aria-label={`XP da linha ${index + 1}`} type="number" value={row.points} onChange={(e) => update(index, { points: e.target.value })} placeholder={cap !== null ? `máx. ${cap}` : 'XP'} className={`w-full px-3 py-2.5 rounded-lg bg-slate-900 border ${over ? 'border-red-500 text-red-300' : 'border-cyan-500/40 text-cyan-200'} outline-none font-mono text-center text-sm`} />
                      {over && <div className="text-[10px] font-mono text-red-400 mt-1 text-center">Máx. {cap} XP</div>}
                    </div>
                  </div>
                ); })}
              </div>
              <div className="mt-6 flex justify-end">
                <button onClick={submit} className="bg-cyan-600/80 hover:bg-cyan-500 border border-cyan-400 text-slate-950 font-montserrat font-bold text-xs py-3 px-6 rounded-lg transition-colors flex items-center gap-2 justify-center uppercase tracking-widest shadow-[0_0_12px_rgba(6,182,212,0.4)]"><Save className="w-4 h-4" /> {saveLabel}</button>
              </div>
            </div>
          );
        };

        // ==========================================
        // ADMIN
        // ==========================================
        const AdminTab = ({ pendingTasks, completedTasks, onCreateTask, onDeleteTask, onCompleteTask, onRenameTask, showToast, onLogout, teams, settings, onToggleVisibility, onUpdateMessage, penalties, onAddPenalty, onDeletePenalty, bonus, onAddBonus, onDeleteBonus, onExport, onImportData, onResetEvent }) => {
          const [newTaskName, setNewTaskName] = useState('');
          const [evaluatingTaskId, setEvaluatingTaskId] = useState(null);
          const [renamingId, setRenamingId] = useState(null);
          const [renameValue, setRenameValue] = useState('');
          const [sysMsg, setSysMsg] = useState(settings.systemMessage || '');
          const [activeAdminSubTab, setActiveAdminSubTab] = useState('provas');

          const [penaltyTeamId, setPenaltyTeamId] = useState('');
          const [penaltyPoints, setPenaltyPoints] = useState('');
          const [penaltyReason, setPenaltyReason] = useState('');

          const [bonusTeamId, setBonusTeamId] = useState('');
          const [bonusPoints, setBonusPoints] = useState('');
          const [bonusReason, setBonusReason] = useState('');

          const [confirmModal, setConfirmModal] = useState({ show: false, message: '', onConfirm: null });
          const closeConfirm = useCallback(() => setConfirmModal({ show: false, message: '', onConfirm: null }), []);
          const askConfirm = (message, action) => setConfirmModal({ show: true, message, onConfirm: () => { action(); closeConfirm(); } });

          const handleCreate = (e) => {
            e.preventDefault();
            if (!newTaskName.trim()) return;
            onCreateTask(newTaskName.trim());
            setNewTaskName('');
          };

          const handleCreatePenalty = (e) => {
            e.preventDefault();
            if (!penaltyTeamId || !penaltyPoints || !penaltyReason.trim()) { showToast('Preencha todos os campos da penalidade.'); return; }
            const pts = Number(penaltyPoints);
            if (!Number.isFinite(pts) || pts <= 0) { showToast('Insira um valor de pontos válido.'); return; }
            onAddPenalty({ teamId: penaltyTeamId, points: pts, reason: penaltyReason.trim() });
            setPenaltyPoints(''); setPenaltyReason(''); setPenaltyTeamId('');
          };

          const handleCreateBonus = (e) => {
            e.preventDefault();
            const pts = Number(bonusPoints);
            if (!bonusTeamId || bonusPoints === '' || !Number.isFinite(pts) || pts <= 0) { showToast('Escolha a tribo e informe uma quantidade de pontos maior que zero.'); return; }
            onAddBonus({ teamId: bonusTeamId, points: pts, reason: bonusReason.trim() });
            setBonusPoints(''); setBonusReason('');
          };

          const startRename = (task) => { setRenamingId(task.id); setRenameValue(task.name); };
          const submitRename = () => {
            if (!renameValue.trim()) { showToast('O nome da prova não pode ficar vazio.'); return; }
            onRenameTask(renamingId, renameValue.trim());
            setRenamingId(null);
          };

          const saveResults = (taskId, results) => { onCompleteTask(taskId, results); setEvaluatingTaskId(null); };

          const handleImportFile = (e) => {
            const file = e.target.files && e.target.files[0];
            e.target.value = '';
            if (!file) return;
            const reader = new FileReader();
            reader.onload = () => {
              try {
                const data = JSON.parse(String(reader.result));
                if (!data || !Array.isArray(data.tasks) || !Array.isArray(data.penalties)) throw new Error('formato');
                askConfirm('[ALERTA DO SISTEMA] Importar este backup vai SUBSTITUIR todos os dados atuais. Continuar?', () => onImportData(data));
              } catch (err) { showToast('Arquivo de backup inválido.'); }
            };
            reader.onerror = () => showToast('Não foi possível ler o arquivo.');
            reader.readAsText(file);
          };

          const subTabs = [
            { id: 'provas', label: 'Gerenciar Provas' },
            { id: 'concluidas', label: 'Provas Concluídas' },
            { id: 'penalidades', label: 'Gerenciar Penalidades', danger: true },
            { id: 'dados', label: 'Dados e Backup' },
          ];

          const renderTitle = (task) => renamingId === task.id ? (
            <div className="flex items-center gap-2 flex-1 mr-3">
              <input aria-label="Novo nome da prova" autoFocus type="text" value={renameValue} onChange={(e) => setRenameValue(e.target.value)} onKeyDown={(e) => { if (e.key === 'Enter') submitRename(); if (e.key === 'Escape') setRenamingId(null); }} className="flex-1 px-3 py-1.5 rounded bg-slate-950 border border-cyan-500/50 text-cyan-200 outline-none font-montserrat font-bold text-sm uppercase" />
              <button aria-label="Salvar nome" onClick={submitRename} className="text-cyan-400 hover:text-cyan-200 p-2 border border-cyan-500/40 rounded"><Save className="w-4 h-4" /></button>
              <button aria-label="Cancelar renomear" onClick={() => setRenamingId(null)} className="text-cyan-600 hover:text-cyan-300 p-2 border border-cyan-900/40 rounded"><X className="w-4 h-4" /></button>
            </div>
          ) : (
            <h3 className="text-base sm:text-lg font-montserrat font-bold text-cyan-100 uppercase tracking-wide">{task.name}</h3>
          );

          return (
            <div className="max-w-4xl mx-auto space-y-8 animate-fade-in relative z-10">
              <div className="flex justify-between items-center solo-panel p-5 rounded-xl">
                <div className="flex items-center gap-4">
                  <div className="bg-cyan-950/60 p-2.5 rounded-lg border border-cyan-500/40 shadow-[0_0_10px_rgba(6,182,212,0.3)]"><Lock className="w-4 h-4 text-cyan-400" /></div>
                  <div>
                    <h2 className="font-montserrat font-bold text-cyan-300 uppercase tracking-widest text-sm">[SISTEMA ADMINISTRATIVO ATIVO]</h2>
                    <p className="text-xs text-cyan-600 font-mono mt-1">Nível de Acesso: Monarca</p>
                  </div>
                </div>
                <button onClick={onLogout} className="flex items-center gap-2 text-red-400 hover:text-red-200 hover:bg-red-950/50 px-4 py-2 rounded-lg font-montserrat font-bold text-xs uppercase tracking-widest transition-colors border border-red-500/30"><LogOut className="w-4 h-4" /> Sair de Sessão</button>
              </div>

              <div className="flex flex-wrap gap-3 border-b border-cyan-500/20 pb-4">
                {subTabs.map(st => {
                  const active = activeAdminSubTab === st.id;
                  const activeCls = st.danger ? 'bg-red-950/80 text-red-300 border-red-500 shadow-[0_0_12px_rgba(239,68,68,0.4)]' : 'bg-cyan-950/80 text-cyan-300 border-cyan-400 shadow-[0_0_12px_rgba(6,182,212,0.4)]';
                  return (
                    <button key={st.id} onClick={() => setActiveAdminSubTab(st.id)} className={`px-5 py-2.5 rounded-lg font-montserrat font-bold text-xs uppercase tracking-widest border transition-all ${active ? activeCls : 'bg-slate-900/40 text-cyan-600 border-cyan-500/20 hover:text-cyan-400'}`}>{st.label}</button>
                  );
                })}
              </div>

              {activeAdminSubTab === 'provas' && (
                <React.Fragment>
                  <div className="solo-panel p-5 sm:p-6 rounded-xl flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-l-2 border-l-cyan-400" style={{ boxShadow: '0 0 20px rgba(6, 182, 212, 0.15)' }}>
                    <div>
                      <h3 className="text-sm font-montserrat font-bold text-cyan-300 mb-1 flex items-center gap-2 uppercase tracking-widest"><Eye className="w-4 h-4 text-cyan-400" /> Visibilidade de Classificação</h3>
                      <p className="text-xs text-cyan-600 font-mono">Oculto: líderes e caçadores com tribo veem apenas os dados da própria tribo.</p>
                    </div>
                    <button onClick={onToggleVisibility} className={`flex items-center gap-2 px-5 py-2.5 rounded-lg font-montserrat font-bold text-xs transition-all uppercase tracking-widest border shadow-[0_0_10px_rgba(6,182,212,0.2)] ${settings.isRankingVisible ? 'bg-cyan-600/80 text-slate-950 border-cyan-400 hover:bg-cyan-500' : 'bg-slate-900 text-cyan-500 border-cyan-500/40 hover:bg-slate-800'}`}>
                      {settings.isRankingVisible ? <React.Fragment><Eye className="w-4 h-4" /> <span>PÚBLICO: REVELADO</span></React.Fragment> : <React.Fragment><EyeOff className="w-4 h-4" /> <span>PÚBLICO: OCULTO</span></React.Fragment>}
                    </button>
                  </div>

                  <div className="solo-panel p-5 sm:p-6 rounded-xl relative border-l-2 border-l-cyan-400 mt-8">
                    <h3 className="text-sm font-montserrat font-bold text-cyan-300 mb-4 flex items-center gap-2 uppercase tracking-widest"><MessageSquare className="w-4 h-4 text-cyan-400" /> Mensagem do Sistema</h3>
                    <textarea aria-label="Mensagem do sistema" value={sysMsg} onChange={(e) => setSysMsg(e.target.value)} className="w-full px-4 py-3 rounded-lg bg-slate-950 border border-cyan-500/40 text-cyan-200 focus:ring-1 focus:ring-cyan-400 outline-none font-inter resize-none h-24 mb-4 shadow-[inset_0_0_8px_rgba(6,182,212,0.1)]" placeholder="Deixe um recado, regra ou dica para os Caçadores..." />
                    <div className="flex justify-end">
                      <button onClick={() => onUpdateMessage(sysMsg)} className="bg-cyan-600/80 hover:bg-cyan-500 border border-cyan-400 text-slate-950 font-montserrat font-bold text-xs py-2.5 px-5 rounded-lg transition-colors flex items-center gap-2 uppercase tracking-widest shadow-[0_0_12px_rgba(6,182,212,0.3)]"><Save className="w-4 h-4" /> Atualizar Mural</button>
                    </div>
                  </div>

                  <div className="solo-panel p-6 sm:p-8 rounded-xl relative mt-8">
                    <div className="absolute top-0 left-0 w-2 h-2 border-t-2 border-l-2 border-cyan-400"></div>
                    <div className="absolute top-0 right-0 w-2 h-2 border-t-2 border-r-2 border-cyan-400"></div>
                    <h3 className="text-sm font-montserrat font-bold text-cyan-300 mb-5 flex items-center gap-2 uppercase tracking-widest"><Plus className="w-4 h-4 text-cyan-400" /> Criar Nova Prova</h3>
                    <form onSubmit={handleCreate} className="flex flex-col sm:flex-row gap-4">
                      <input aria-label="Nome da prova" type="text" value={newTaskName} onChange={(e) => setNewTaskName(e.target.value)} placeholder="Nome da Prova (Ex: Prova 1)" className="flex-1 px-4 py-3 rounded-lg bg-slate-950 border border-cyan-500/40 text-cyan-200 placeholder-cyan-700 focus:ring-1 focus:ring-cyan-400 outline-none font-inter shadow-[inset_0_0_8px_rgba(6,182,212,0.2)]" required />
                      <button type="submit" className="bg-cyan-600/80 hover:bg-cyan-500 border border-cyan-400 text-slate-950 font-montserrat font-bold text-xs py-3 px-6 rounded-lg transition-colors whitespace-nowrap uppercase tracking-widest shadow-[0_0_12px_rgba(6,182,212,0.4)]">Cadastrar</button>
                    </form>
                  </div>

                  <div>
                    <h3 className="text-sm font-montserrat font-bold text-cyan-300 mb-5 uppercase tracking-widest">[PROVAS PENDENTES]</h3>
                    {pendingTasks.length === 0 ? (
                      <p className="text-cyan-600 font-mono text-xs solo-panel p-6 rounded-xl text-center uppercase tracking-widest">Nenhuma prova pendente.</p>
                    ) : (
                      <div className="space-y-4">
                        {pendingTasks.map(task => (
                          <div key={task.id} className="solo-panel rounded-xl overflow-hidden border-l-2 border-l-cyan-400" style={{ boxShadow: '0 0 20px rgba(6, 182, 212, 0.15)' }}>
                            <div className="p-5 sm:p-6">
                              <div className="flex justify-between items-start mb-5">
                                {renderTitle(task)}
                                <div className="flex items-center gap-2">
                                  {renamingId !== task.id && <button aria-label="Renomear prova" onClick={() => startRename(task)} className="text-cyan-500 hover:text-cyan-300 p-2 hover:bg-cyan-950/40 rounded-lg transition-colors border border-cyan-900/40"><Pencil className="w-4 h-4" /></button>}
                                  <button aria-label="Excluir prova" onClick={() => askConfirm('[ALERTA DO SISTEMA] Deseja realmente expurgar este registro de masmorra?', () => onDeleteTask(task.id))} className="text-cyan-500 hover:text-cyan-300 p-2 hover:bg-cyan-950/40 rounded-lg transition-colors border border-cyan-900/40"><Trash2 className="w-4 h-4" /></button>
                                </div>
                              </div>
                              {evaluatingTaskId === task.id ? (
                                <TaskResultsForm teams={teams} showToast={showToast} onCancel={() => setEvaluatingTaskId(null)} onSave={(res) => saveResults(task.id, res)} />
                              ) : (
                                <button onClick={() => setEvaluatingTaskId(task.id)} className="w-full bg-slate-900/60 hover:bg-slate-800 text-cyan-300 border border-cyan-500/40 font-montserrat font-bold py-3.5 px-4 rounded-lg flex justify-center items-center gap-2 uppercase tracking-widest shadow-[0_0_10px_rgba(6,182,212,0.2)]"><Award className="w-4 h-4" /> Registrar Resultados</button>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>

                  <div className="solo-panel p-5 sm:p-6 rounded-xl relative border-l-2 border-l-cyan-400 mt-8" style={{ boxShadow: '0 0 20px rgba(6, 182, 212, 0.15)' }}>
                    <h3 className="text-sm font-montserrat font-bold text-cyan-300 mb-1 flex items-center gap-2 uppercase tracking-widest"><Star className="w-4 h-4 text-cyan-400" /> Pontos Avulsos</h3>
                    <p className="text-xs text-cyan-600 font-mono mb-5">Registro à parte: estes pontos ficam salvos e aparecem somente aqui. Não entram no ranking.</p>
                    <form onSubmit={handleCreateBonus} className="space-y-4 mb-6">
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                        <div>
                          <label htmlFor="bonus-team" className="block text-xs font-montserrat font-bold text-cyan-400 uppercase tracking-widest mb-2">Tribo</label>
                          <select id="bonus-team" value={bonusTeamId} onChange={(e) => setBonusTeamId(e.target.value)} className="w-full px-4 py-3 rounded-lg bg-slate-950 border border-cyan-500/40 text-cyan-200 outline-none font-inter text-sm">
                            <option value="">Selecionar Tribo...</option>
                            {teams.map(team => <option key={team.id} value={team.id}>{team.name}</option>)}
                          </select>
                        </div>
                        <div>
                          <label htmlFor="bonus-pts" className="block text-xs font-montserrat font-bold text-cyan-400 uppercase tracking-widest mb-2">Pontos (XP)</label>
                          <input id="bonus-pts" type="number" min="1" value={bonusPoints} onChange={(e) => setBonusPoints(e.target.value)} placeholder="Ex: 20" className="w-full px-4 py-3 rounded-lg bg-slate-950 border border-cyan-500/40 text-cyan-200 outline-none font-mono text-sm" />
                        </div>
                      </div>
                      <div>
                        <label htmlFor="bonus-reason" className="block text-xs font-montserrat font-bold text-cyan-400 uppercase tracking-widest mb-2">Descrição (opcional)</label>
                        <input id="bonus-reason" type="text" value={bonusReason} onChange={(e) => setBonusReason(e.target.value)} placeholder="Ex: Bônus de participação" className="w-full px-4 py-3 rounded-lg bg-slate-950 border border-cyan-500/40 text-cyan-200 outline-none font-inter text-sm" />
                      </div>
                      <div className="flex justify-end">
                        <button type="submit" className="bg-cyan-600/80 hover:bg-cyan-500 border border-cyan-400 text-slate-950 font-montserrat font-bold text-xs py-3 px-6 rounded-lg transition-colors uppercase tracking-widest shadow-[0_0_12px_rgba(6,182,212,0.4)]">Adicionar Pontos</button>
                      </div>
                    </form>

                    {bonus.length > 0 && (
                      <div className="flex flex-wrap gap-2 mb-4">
                        {teams.map(team => (
                          <span key={team.id} className="px-3 py-1 rounded border border-cyan-900/60 bg-slate-950 font-mono text-[11px]">
                            <span className={`${team.text} font-bold uppercase`}>{team.name}</span> <span className="text-cyan-200">+{bonus.filter(b => b.teamId === team.id).reduce((sum, b) => sum + b.points, 0)} XP</span>
                          </span>
                        ))}
                      </div>
                    )}

                    {bonus.length === 0 ? (
                      <p className="text-cyan-600 font-mono text-xs text-center py-4 uppercase tracking-widest">Nenhum ponto avulso registrado.</p>
                    ) : (
                      <div className="space-y-3">
                        {bonus.map(b => {
                          const team = teams.find(t => t.id === b.teamId);
                          return (
                            <div key={b.id} className="flex items-center justify-between gap-3 bg-slate-950 p-3 rounded-lg border border-cyan-900/60">
                              <div className="min-w-0">
                                <div className="flex flex-wrap items-center gap-3 mb-1">
                                  <span className={`font-montserrat font-bold text-sm uppercase tracking-wider ${team ? team.text : 'text-cyan-400'}`}>{team ? team.name : 'Tribo Desconhecida'}</span>
                                  <span className="bg-cyan-950/80 text-cyan-300 font-mono font-bold text-xs px-2 py-0.5 rounded border border-cyan-500/40">+{b.points} XP</span>
                                  {b.createdAt && <span className="text-cyan-700 font-mono text-[10px]">{new Date(b.createdAt).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' })}</span>}
                                </div>
                                {b.reason && <p className="text-cyan-200 font-inter text-xs break-words">{b.reason}</p>}
                              </div>
                              <button aria-label="Apagar pontos avulsos" onClick={() => askConfirm('[ALERTA DO SISTEMA] Deseja apagar este registro de pontos avulsos?', () => onDeleteBonus(b.id))} className="text-red-400 hover:text-red-200 p-2 hover:bg-red-950/50 rounded-lg transition-colors border border-red-900/40 shrink-0"><Trash2 className="w-4 h-4" /></button>
                            </div>
                          );
                        })}
                      </div>
                    )}
                  </div>
                </React.Fragment>
              )}

              {activeAdminSubTab === 'concluidas' && (
                <div className="space-y-8 animate-fade-in">
                  <h3 className="text-sm font-montserrat font-bold text-cyan-300 mb-5 uppercase tracking-widest">[PROVAS CONCLUÍDAS]</h3>
                  {completedTasks.length === 0 ? (
                    <p className="text-cyan-600 font-mono text-xs solo-panel p-6 rounded-xl text-center uppercase tracking-widest">Nenhuma prova concluída ainda.</p>
                  ) : (
                    <div className="space-y-4">
                      {completedTasks.map(task => (
                        <div key={task.id} className="solo-panel rounded-xl overflow-hidden border-l-2 border-l-cyan-400" style={{ boxShadow: '0 0 20px rgba(6, 182, 212, 0.15)' }}>
                          <div className="p-5 sm:p-6">
                            <div className="flex justify-between items-center mb-4">
                              {renderTitle(task)}
                              <div className="flex items-center gap-2">
                                {renamingId !== task.id && <button aria-label="Renomear prova" onClick={() => startRename(task)} className="text-cyan-500 hover:text-cyan-300 p-2 hover:bg-cyan-950/40 rounded-lg transition-colors border border-cyan-900/40"><Pencil className="w-4 h-4" /></button>}
                                <button aria-label="Editar resultados" onClick={() => setEvaluatingTaskId(evaluatingTaskId === task.id ? null : task.id)} className="text-cyan-500 hover:text-cyan-300 p-2 hover:bg-cyan-950/40 rounded-lg transition-colors border border-cyan-900/40" title="Editar resultados"><Edit className="w-4 h-4" /></button>
                                <button aria-label="Excluir prova" onClick={() => askConfirm('[ALERTA DO SISTEMA] Deseja realmente expurgar este registro de masmorra?', () => onDeleteTask(task.id))} className="text-red-400 hover:text-red-300 p-2 hover:bg-red-950/40 rounded-lg transition-colors border border-red-900/40" title="Excluir Prova"><Trash2 className="w-4 h-4" /></button>
                              </div>
                            </div>
                            {evaluatingTaskId === task.id ? (
                              <TaskResultsForm teams={teams} showToast={showToast} initialResults={task.results} saveLabel="Salvar Alterações" onCancel={() => setEvaluatingTaskId(null)} onSave={(res) => saveResults(task.id, res)} />
                            ) : (
                              <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 bg-slate-950/50 p-4 rounded-lg border border-cyan-900/30">
                                {task.results && [...task.results].sort((a, b) => a.place - b.place).map(result => {
                                  const team = teams.find(t => t.id === result.teamId);
                                  if (!team) return null;
                                  return (
